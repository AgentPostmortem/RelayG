[project]
name = "relayg"
version = "0.1.0"
description = "Support ticket triage agent built as a LangGraph state machine with policy rules and human-in-the-loop refund approval."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-groq>=0.3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["relayg"]
